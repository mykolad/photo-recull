name: Build and Test

# Every PR (required to pass before merging into master), every push to master, and on demand.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: build-and-test
    # The app runs on Windows (local OneDrive folder, Windows browsers), so it's tested there too.
    runs-on: windows-latest
    timeout-minutes: 15
    # A newer push to a PR replaces its run in progress.
    concurrency:
      group: build-and-test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore PhotoRecull.slnx

      - name: Build
        run: dotnet build PhotoRecull.slnx -c Release --no-restore

      - name: Test
        run: dotnet test PhotoRecull.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          retention-days: 14
