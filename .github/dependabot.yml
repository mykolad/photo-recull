# Package updates as PRs, once a week, related packages together. Security updates come as soon as an advisory is
# out, whatever the schedule.
version: 2
updates:
  # Directory.Packages.props holds every package version.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A release gets a week before it's taken: a broken or malicious one is usually pulled by then.
    # Security updates don't wait.
    cooldown:
      default-days: 7
    # A package is grouped by the first group it matches. Any other major update gets a PR of its own, as it may need
    # code changes.
    groups:
      windows-app-sdk:
        patterns:
          - Microsoft.WindowsAppSDK
          - Microsoft.Windows.SDK.BuildTools
      tests:
        patterns:
          - coverlet.*
          - Microsoft.NET.Test.Sdk
          - xunit*
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
